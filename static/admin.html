<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Licensing Register</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main>
    <h1 id="page-title"></h1>
    <section class="stats" id="stats"></section>

    <div class="layout">
      <section class="card register">
        <div class="toolbar">
          <input id="search" type="search">
          <select id="filter">
            <option value="">All statuses</option>
            <option value="active">Active</option>
            <option value="suspended">Suspended</option>
            <option value="revoked">Revoked</option>
            <option value="expired">Expired</option>
            <option value="expiring">Expiring ≤ 30 days</option>
          </select>
          <span class="spacer"></span>
          <a class="btn secondary" id="import-btn" hidden>Import spreadsheet</a>
          <button id="add-btn"></button>
        </div>
        <div class="table-wrap">
          <table class="cards">
            <thead><tr id="head"></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>

      <aside class="card">
        <h2>Recent activity</h2>
        <ul class="audit" id="audit"></ul>
      </aside>
    </div>
  </main>

  <dialog id="record-dialog">
    <form id="record-form">
      <h2 id="dialog-title"></h2>
      <div class="grid-2" id="form-fields"></div>
      <p class="error" id="dialog-error"></p>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="cancel">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="notify-dialog" class="small-dialog">
    <h2>Notify the operator?</h2>
    <p id="notify-question"></p>
    <div class="dialog-actions">
      <button type="button" class="secondary" id="notify-no">No</button>
      <button type="button" id="notify-yes">Yes</button>
    </div>
  </dialog>

  <dialog id="email-dialog">
    <div class="dialog-head">
      <h2>Email to operator</h2>
      <button type="button" id="email-copy">Click to copy</button>
    </div>
    <p class="small">Paste this into your email client. You can edit the text here before copying.</p>
    <p class="notice-inline" id="email-warning" hidden></p>
    <label for="email-text" class="visually-hidden">Email text</label>
    <textarea id="email-text" rows="13"></textarea>
    <div class="dialog-actions">
      <button type="button" class="secondary" id="email-close">Close</button>
    </div>
  </dialog>

  <div class="toast" id="toast"></div>

  <script src="/app.js"></script>
  <script>
    const fmtDate = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    const daysUntil = iso => Math.ceil((new Date(iso + 'T00:00:00') - new Date().setHours(0,0,0,0)) / 86400000);
    const expiryCell = iso => {
      const days = daysUntil(iso);
      const pill = days < 0 ? '<span class="pill bad">Expired</span>'
        : days <= 30 ? `<span class="pill warn">${days} days left</span>` : '';
      return `<span class="nowrap">${fmtDate(iso)}</span> ${pill}`;
    };

    // Everything that differs between the drivers and vehicles registers.
    const REGISTERS = {
      drivers: {
        title: 'Licensed drivers', singular: 'driver', total: 'Drivers on register',
        search: 'Search name or licence number…',
        name: d => d.full_name,
        ref: d => d.licence_number,
        emailSubject: d => `Driver ${d.full_name} (licence number ${d.licence_number})`,
        searchText: d => [d.full_name, d.licence_number],
        expiryFields: ['expiry_date'],
        columns: [
          ['Driver', d => `<span class="name"><strong>${esc(d.full_name)}</strong></span><span class="sub">${esc(d.licence_number)}</span>`],
          ['Type', d => esc(d.licence_type)],
          ['Licence expiry', d => expiryCell(d.expiry_date)],
        ],
        form: [
          { name: 'full_name', label: 'Full name', required: true, full: true },
          { name: 'licence_number', label: 'Licence / badge number', required: true },
          { name: 'licence_type', label: 'Licence type', type: 'licence_type' },
          { name: 'expiry_date', label: 'Licence expiry', type: 'date', required: true },
          { name: 'status', label: 'Status', type: 'status' },
          { name: 'phone', label: 'Phone' },
          { name: 'email', label: 'Email', type: 'email' },
          { name: 'notes', label: 'Internal notes', type: 'textarea', full: true },
        ],
      },
      vehicles: {
        title: 'Licensed vehicles', singular: 'vehicle', total: 'Vehicles on register',
        search: 'Search reg, plate, make or proprietor…',
        name: v => `${v.registration} (${v.make} ${v.model})`,
        ref: v => `plate ${v.plate_number}`,
        emailSubject: v => `Vehicle ${v.registration}, ${v.make} ${v.model} (plate ${v.plate_number})`,
        searchText: v => [v.registration, v.plate_number, v.make, v.model, v.proprietor_name],
        expiryFields: ['licence_expiry', 'test_expiry'],
        columns: [
          ['Vehicle', v => `<span class="name nowrap"><strong class="reg">${esc(v.registration)}</strong></span><span class="sub nowrap">Plate ${esc(v.plate_number)}</span>`],
          ['Make &amp; model', v => `${esc(v.make)} ${esc(v.model)}<span class="sub">${[v.colour, v.licence_type].filter(Boolean).map(esc).join(' · ')}</span>`],
          ['Proprietor', v => esc(v.proprietor_name)],
          ['Licence expiry', v => expiryCell(v.licence_expiry)],
          ['Test certificate expiry', v => expiryCell(v.test_expiry)],
        ],
        form: [
          { name: 'registration', label: 'Registration', required: true },
          { name: 'plate_number', label: 'Council plate number', required: true },
          { name: 'make', label: 'Make', required: true },
          { name: 'model', label: 'Model', required: true },
          { name: 'colour', label: 'Colour' },
          { name: 'licence_type', label: 'Licence type', type: 'licence_type' },
          { name: 'proprietor_name', label: 'Proprietor name', required: true, full: true },
          { name: 'licence_expiry', label: 'Licence expiry', type: 'date', required: true },
          { name: 'test_expiry', label: 'Test certificate expiry', type: 'date', required: true },
          { name: 'status', label: 'Status', type: 'status' },
          { name: 'notes', label: 'Internal notes', type: 'textarea', full: true },
        ],
      },
    };

    const kind = location.pathname.endsWith('/vehicles') ? 'vehicles' : 'drivers';
    const R = REGISTERS[kind];
    const API = `/api/admin/${kind}`;
    let records = [], statuses = [], licenceTypes = [], editingId = null;

    const isPublic = r => r.status === 'active' && !r.expired;
    const expiring = r => r.status === 'active' && !r.expired && R.expiryFields.some(f => daysUntil(r[f]) <= 30);

    document.title = `${R.title} · Licensing Register`;
    $('page-title').textContent = R.title;
    $('search').placeholder = R.search;
    $('add-btn').textContent = `+ Add ${R.singular}`;
    $('head').innerHTML = [...R.columns.map(c => c[0]), 'Status', 'Public register', '']
      .map(h => `<th>${h}</th>`).join('');

    async function load() {
      const data = await api(API);
      records = data.records; statuses = data.statuses; licenceTypes = data.licence_types;
      render(); loadActivity();
    }

    async function loadActivity() {
      const { entries } = await api(`${API}/activity`);
      $('audit').innerHTML = entries.map(e => `
        <li><strong>${esc(e.label)}</strong> <span class="small">${esc(e.sub)}</span><br>
        ${esc(e.detail)}<time>${fmtDateTime(e.created_at)} · by ${esc(e.staff_name || 'system')}</time></li>
      `).join('') || '<li class="small">No activity yet.</li>';
    }

    function render() {
      const count = f => records.filter(f).length;
      $('stats').innerHTML = [
        [records.length, R.total],
        [count(isPublic), 'Showing as licensed publicly'],
        [count(r => r.status === 'suspended'), 'Suspended'],
        [count(expiring), 'Expiring within 30 days'],
        [count(r => r.expired && r.status === 'active'), 'Expired (needs renewal)'],
      ].map(([n, l]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

      // Ignore spaces and dashes so "gn66uyb" finds "GN66 UYB" and "phv0288" finds "PHV-0288".
      const squash = t => (t || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      const q = $('search').value.trim().toLowerCase(), qs = squash(q);
      const f = $('filter').value;
      const rows = records.filter(r =>
        (!q || R.searchText(r).some(t => (t || '').toLowerCase().includes(q) || (qs && squash(t).includes(qs)))) &&
        (!f || (f === 'expired' ? r.expired : f === 'expiring' ? expiring(r) : r.status === f)));

      const colspan = R.columns.length + 3;
      $('rows').innerHTML = rows.map(r => `
        <tr class="is-${r.status}">
          ${R.columns.map(([head, cell], i) => i === 0
              ? `<td class="card-title">${cell(r)}</td>`
              : `<td data-label="${head}"><div>${cell(r)}</div></td>`).join('')}
          <td class="status-cell" data-label="Status">
            <select class="status-select ${r.status}" data-id="${r.id}" aria-label="Status for ${esc(R.name(r))}">
              ${statuses.map(s => `<option value="${s}" ${s === r.status ? 'selected' : ''}>${cap(s)}</option>`).join('')}
            </select>
          </td>
          <td data-label="Public register">${isPublic(r) ? '<span class="pill public">Visible</span>' : '<span class="pill hidden">Hidden</span>'}</td>
          <td class="actions-cell"><button class="link" data-edit="${r.id}">Edit</button></td>
        </tr>`).join('') || `<tr><td colspan="${colspan}" class="small">No ${R.singular}s match.</td></tr>`;
    }

    // Status dropdown: suspending or revoking hides the record from the public register immediately.
    $('rows').addEventListener('change', async e => {
      const sel = e.target.closest('.status-select');
      if (!sel) return;
      const r = records.find(x => x.id == sel.dataset.id);
      const next = sel.value, previous = r.status;
      if (next !== 'active' && !confirm(`${cap(next)} ${R.name(r)}, ${R.ref(r)}?\n\nIt will no longer appear as licensed on the public register.`)) {
        sel.value = r.status; return;
      }
      try {
        const { record } = await api(`${API}/${r.id}`, { method: 'PATCH', body: JSON.stringify({ status: next }) });
        Object.assign(r, record);
        render(); loadActivity();
        toast(`${R.name(r)} is now ${next}` + (isPublic(r) ? ' — visible on public register' : ' — hidden from public register'));
        offerOperatorEmail(r, previous);
      } catch (err) { sel.value = r.status; toast(err.message); }
    });

    // After a suspension, revocation or reinstatement, offer a ready-made email for the operator.
    const EXPIRY_NAMES = { expiry_date: 'licence', licence_expiry: 'licence', test_expiry: 'test certificate' };
    let emailRecord = null, emailPrevious = null;

    const isRestriction = r => r.status === 'suspended' || r.status === 'revoked';
    const isReinstatement = (r, previous) =>
      r.status === 'active' && (previous === 'suspended' || previous === 'revoked');
    const reinstatedWord = previous => previous === 'revoked' ? 'reinstated' : 'unsuspended';

    function offerOperatorEmail(r, previous) {
      if (!isRestriction(r) && !isReinstatement(r, previous)) return;
      emailRecord = { ...r };
      emailPrevious = previous;
      const what = isRestriction(r) ? r.status : `${reinstatedWord(previous)} (now Active)`;
      $('notify-question').textContent =
        `${R.name(r)} has been ${what}. Do you want to notify the operator via email?`;
      $('notify-dialog').showModal();
    }

    function operatorEmail(r, previous) {
      if (isRestriction(r)) return `Dear Operator,

Please note that ${R.emailSubject(r)} has been ${r.status} with immediate effect.

Please do not allow any bookings to be taken by this ${R.singular} until further notice.

If you have any questions, please reach out to our Licensing Team.

This ${R.singular} has been removed from our public register.

Kind regards,
Licensing Team`;
      // An expired licence or test certificate keeps it hidden, so don't claim it's visible.
      const registerLine = r.expired
        ? `This ${R.singular} will be visible on our public register once its ${lapsedNames(r)} has been renewed.`
        : `This ${R.singular} is now visible on our public register.`;
      return `Dear Operator,

${R.emailSubject(r)} has now been ${reinstatedWord(previous)}.

${registerLine}

Kind regards,
Licensing Team`;
    }

    // Reactivating doesn't help if a date has lapsed: it stays off the public register.
    const lapsedNames = r => R.expiryFields.filter(f => daysUntil(r[f]) < 0).map(f => EXPIRY_NAMES[f]).join(' and ');

    function expiryWarning(r) {
      if (isRestriction(r) || !r.expired) return '';
      return `Check before sending: this ${R.singular}'s ${lapsedNames(r)} has expired, so the ${R.singular} is still hidden from the public register and shouldn't take bookings until it's renewed.`;
    }

    $('notify-no').onclick = () => $('notify-dialog').close();
    $('notify-yes').onclick = () => {
      $('notify-dialog').close();
      $('email-text').value = operatorEmail(emailRecord, emailPrevious);
      $('email-warning').textContent = expiryWarning(emailRecord);
      $('email-warning').hidden = !$('email-warning').textContent;
      $('email-copy').textContent = 'Click to copy';
      $('email-dialog').showModal();
    };
    $('email-close').onclick = () => $('email-dialog').close();
    $('email-copy').onclick = async () => {
      const box = $('email-text');
      // Copying the selected text works instantly in every browser; the newer
      // clipboard API is the fallback because some browsers hold it behind a prompt.
      box.select();
      let copied = false;
      try { copied = document.execCommand('copy'); } catch { /* not supported */ }
      if (!copied) {
        try { await navigator.clipboard.writeText(box.value); copied = true; } catch { /* blocked */ }
      }
      box.setSelectionRange(0, 0);
      $('email-copy').textContent = copied ? 'Copied ✓' : 'Press Ctrl+C / ⌘C to copy';
      if (!copied) box.select();
      setTimeout(() => { $('email-copy').textContent = 'Click to copy'; }, 3000);
    };

    // Add / edit dialog, built from the register's form definition.
    function fieldHtml(f) {
      const id = `f-${f.name}`;
      const attrs = `id="${id}" name="${f.name}" ${f.required ? 'required' : ''}`;
      const input =
        f.type === 'textarea' ? `<textarea ${attrs} rows="3"></textarea>` :
        f.type === 'licence_type' ? `<select ${attrs}>${licenceTypes.map(t => `<option>${esc(t)}</option>`).join('')}</select>` :
        f.type === 'status' ? `<select ${attrs}>${statuses.map(s => `<option value="${s}">${cap(s)}</option>`).join('')}</select>` :
        `<input ${attrs} type="${f.type || 'text'}">`;
      return `<div class="${f.full ? 'full' : ''}"><label for="${id}">${f.label}</label>${input}</div>`;
    }

    function openDialog(r) {
      editingId = r ? r.id : null;
      $('dialog-title').textContent = r ? `Edit ${R.name(r)}` : `Add ${R.singular}`;
      $('form-fields').innerHTML = R.form.map(fieldHtml).join('');
      if (r) for (const el of $('record-form').elements) if (el.name) el.value = r[el.name] ?? '';
      $('dialog-error').textContent = '';
      $('record-dialog').showModal();
    }
    $('add-btn').onclick = () => openDialog(null);
    $('rows').addEventListener('click', e => {
      const id = e.target.dataset.edit;
      if (id) openDialog(records.find(r => r.id == id));
    });
    $('cancel').onclick = () => $('record-dialog').close();

    $('record-form').addEventListener('submit', async e => {
      e.preventDefault();
      const body = JSON.stringify(Object.fromEntries(new FormData(e.target)));
      const previousStatus = editingId ? records.find(r => r.id === editingId).status : null;
      try {
        const { record } = editingId
          ? await api(`${API}/${editingId}`, { method: 'PATCH', body })
          : await api(API, { method: 'POST', body });
        $('record-dialog').close();
        toast(`${cap(R.singular)} ${editingId ? 'updated' : 'added'}`);
        if (editingId && record.status !== previousStatus) offerOperatorEmail(record, previousStatus);
        load();
      } catch (err) { $('dialog-error').textContent = err.message; }
    });

    $('search').oninput = render;
    $('filter').onchange = render;
    initStaffPage(kind).then(user => {
      $('import-btn').href = `/admin/${kind}/import`;
      $('import-btn').hidden = user.role !== 'admin';
      load();
    });
  </script>
</body>
</html>
