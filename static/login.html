<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Licensing Staff Sign-in</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="crest">DC</span> Licensing Team</div>
    <a href="/">Public checker</a>
  </header>
  <main class="narrow">
    <form id="login" class="card stack auth-card">
      <h1>Staff sign-in</h1>
      <div>
        <label for="email">Work email</label>
        <input id="email" type="email" autocomplete="username" required autofocus>
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Sign in</button>
      <p class="error" id="err"></p>
      <p class="small">Forgotten your password? Ask a licensing admin to reset it.</p>
    </form>
  </main>
  <script>
    document.getElementById('login').addEventListener('submit', async e => {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        })
      });
      const data = await res.json();
      if (res.ok) location.href = data.must_change_password ? '/account' : '/admin';
      else document.getElementById('err').textContent = data.error;
    });
  </script>
</body>
</html>
